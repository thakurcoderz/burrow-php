name: Xdebug trial

# One-off: build PHP linked against glibc with a shared xdebug.so, and
# prove PHP can load it. Informs the switch of the main builds.
on:
  workflow_dispatch:
    inputs:
      minor:
        default: "8.4"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SPC_LIBC: glibc
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        id: v
        run: echo "version=$(curl -fsSL "https://www.php.net/releases/?json&version=${{ inputs.minor }}" | jq -r .version)" >> "$GITHUB_OUTPUT"
      - name: Get static-php-cli
        run: |
          curl -fsSL -o spc.tgz "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-linux-x86_64.tar.gz"
          tar xzf spc.tgz && chmod +x spc && ./spc --version
      - run: ./spc download --with-php=${{ steps.v.outputs.version }} --for-extensions="$(cat extensions.txt),xdebug" --prefer-pre-built --retry=3
      - name: Build (glibc, xdebug shared)
        run: |
          ./spc doctor --auto-fix
          ./spc build "$(cat extensions.txt)" --build-cli --build-fpm --build-shared=xdebug
      - name: Check
        run: |
          ls -la buildroot/bin buildroot/modules || true
          ldd buildroot/bin/php || true
          scripts/check.sh buildroot/bin
          so=$(find buildroot -name xdebug.so | head -1); echo "xdebug: $so"
          buildroot/bin/php -n -d "zend_extension=$PWD/$so" -r 'echo phpversion("xdebug"), PHP_EOL;'
          buildroot/bin/php -d "zend_extension=$PWD/$so" -m | grep -i xdebug
  macos:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        id: v
        run: echo "version=$(curl -fsSL "https://www.php.net/releases/?json&version=${{ inputs.minor }}" | jq -r .version)" >> "$GITHUB_OUTPUT"
      - name: Get static-php-cli
        run: |
          curl -fsSL -o spc.tgz "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-macos-aarch64.tar.gz"
          tar xzf spc.tgz && chmod +x spc && ./spc --version
      - run: ./spc download --with-php=${{ steps.v.outputs.version }} --for-extensions="$(cat extensions.txt),xdebug" --retry=3
      - name: Build (xdebug shared)
        run: |
          ./spc doctor --auto-fix
          ./spc build "$(cat extensions.txt)" --build-cli --build-fpm --build-shared=xdebug
      - name: Check
        run: |
          scripts/check.sh buildroot/bin
          so=$(find buildroot -name xdebug.so | head -1); echo "xdebug: $so"
          buildroot/bin/php -n -d "zend_extension=$PWD/$so" -r 'echo phpversion("xdebug"), PHP_EOL;'
